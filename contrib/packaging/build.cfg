{
	"_common": {
		"errbot_version": "6.2.1",
		"build_dir": "pkg-build",
		"version": "{version}",
		"pkg_version": "2",
		"archive": {
			"path": "/opt",
			"filename": "err-stackstorm_{version}_{distro}_x86_64.tar.gz"
		},
		"maintainer": {
			"name": "Carlos",
			"email": "nzlosh@yhaoo.com"
		}
	},
	"rocky9": {
		"build_deps": [
			"gcc",
			"rpm-build",
			"rpm-devel",
			"rpmlint",
			"make",
			"python3.11",
			"bash",
			"coreutils",
			"diffutils",
			"patch",
			"rpmdevtools"
		],
		"runtime_deps": [
			"python3-3.11"
		],
		"pkg_build": {
			"deps": [
				"python3.11",
				"python3.11-devel",
				"tar",
				"gcc",
				"git",
				"wget"
			],
			"bin": "rpmbuild",
			"args": ["-ba", "err-stackstorm.spec"]
		},
		"pkg_bin": "dnf",
		"pybin": "python3.11",
		"template_dir": "templates/redhat",
		"templates": [
			{"src": "err-stackstorm.spec"}
		],
		"build_assets": []
	},
	"rocky10": {
		"build_deps": [
			"gcc",
			"rpm-build",
			"rpm-devel",
			"rpmlint",
			"make",
			"python3.12",
			"bash",
			"coreutils",
			"diffutils",
			"patch",
			"rpmdevtools"
		],
		"runtime_deps": [
			"python3.12"
		],
		"pkg_build": {
			"deps": [
				"python3.12",
				"python3.12-devel",
				"tar",
				"gcc",
				"git",
				"wget"
			],
			"bin": "rpmbuild",
			"args": ["-ba", "err-stackstorm.spec"]
		},
		"pkg_bin": "dnf",
		"pybin": "python3.12",
		"template_dir": "templates/redhat",
		"templates": [
			{"src": "err-stackstorm.spec"}
		],
		"build_assets": []
	},
	"debian12": {
		"build_deps": [
			"build-essential",
			"devscripts",
			"debhelper",
			"python3.11-dev"
		],
		"runtime_deps": [
			"python3.11-minimal",
			"python3.11-venv"
		],
		"pkg_build": {
			"deps": [
				"python3.11-minimal",
				"git",
				"wget"
			],
			"bin": "fakeroot",
			"args": ["dpkg-buildpackage", "-us", "-uc"]
		},
		"pkg_bin": "apt",
		"pybin": "python3.11",
		"template_dir": "templates/ubuntu",
		"templates": [
			{"src": "debian/changelog"},
			{"src": "debian/control"},
			{"src": "debian/rules"},
			{"src": "debian/watch"}
		],
		"build_assets": []
	},
